<title>Framework Scan Report</title>
<style>

}

  }
}

  --accent: #7ea2ff; --accent-soft: #24304a; --code-bg: #151a21;
  --high: #ff8a80; --high-soft: #3a1f1f; --medium: #ffb74d; --medium-soft: #3a2c19;

}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 24px 0; }
header h1 { margin: 0; font-size: 20px; }
header .meta { color: var(--muted); font-size: 13px; margin-top: 2px; word-break: break-all; }
nav { display: flex; gap: 4px; margin-top: 12px; overflow-x: auto; }
nav a { padding: 8px 14px; color: var(--muted); text-decoration: none; border-bottom: 2px solid transparent; white-space: nowrap; font-weight: 500; }
nav a.active { color: var(--accent); border-bottom-color: var(--accent); }
nav a .n { background: var(--surface-2); border-radius: 10px; padding: 0 7px; font-size: 12px; margin-left: 4px; }
main { padding: 20px 24px 48px; max-width: 1400px; margin: 0 auto; }
section { display: none; } section.active { display: block; }
h2 { font-size: 17px; margin: 24px 0 10px; } h2:first-child { margin-top: 0; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
.tile .v { font-size: 26px; font-weight: 650; font-variant-numeric: tabular-nums; }
.tile .l { color: var(--muted); font-size: 13px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; margin-bottom: 14px; min-width: 0; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.bar { height: 8px; background: var(--accent); border-radius: 4px; min-width: 2px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
input[type=search], select { background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 7px 10px; font: inherit; }
input[type=search] { flex: 1 1 260px; min-width: 0; }
label.chk { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); }
.chip { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.sev-HIGH { background: var(--high-soft); color: var(--high); } .sev-MEDIUM { background: var(--medium-soft); color: var(--medium); }
.sev-LOW { background: var(--low-soft); color: var(--low); } .sev-INFO { background: var(--info-soft); color: var(--info); }
.lvl { background: var(--accent-soft); color: var(--accent); }
.muted { color: var(--muted); } .small { font-size: 12px; }
code, pre { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 12.5px; }
pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 6px; padding: 10px; overflow: auto; margin: 6px 0; }
.cls { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 10px; background: var(--surface); }
.cls > summary { cursor: pointer; padding: 10px 14px; display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; }
.cls > summary b { font-size: 15px; }
.mrow { cursor: pointer; } .mrow:hover td { background: var(--surface-2); }
.mname { font-weight: 600; font-family: ui-monospace, Consolas, monospace; font-size: 13px; word-break: break-all; }
.detail td { background: var(--surface-2); }
.actions li { margin: 2px 0; }
.table-wrap { overflow-x: auto; }
.cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cmp .side { min-width: 0; }
.diff { background: var(--code-bg); border: 1px solid var(--border); border-radius: 6px; overflow: auto; font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
.diff div { white-space: pre; padding: 0 8px; min-height: 1.45em; }
.diff .d-del { background: var(--del); } .diff .d-add { background: var(--add); } .diff .d-gap { background: var(--surface-2); }
.keep { color: var(--accent); font-weight: 600; }
.rule h3 { margin: 0 0 4px; font-size: 15px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.ba { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ba .t { font-size: 12px; font-weight: 600; color: var(--muted); }
.more { background: none; border: 1px solid var(--border); color: var(--accent); border-radius: 6px; padding: 4px 10px; cursor: pointer; font: inherit; margin-top: 6px; }
.clickable { cursor: pointer; } .clickable:hover td { background: var(--surface-2); }
.empty { color: var(--muted); padding: 20px; text-align: center; }
.themebtn { float: right; background: none; border: 1px solid var(--border); color: var(--muted); border-radius: 6px; padding: 4px 10px; cursor: pointer; font: inherit; }
@media (max-width: 760px) {
  header { padding: 12px 16px 0; } main { padding: 16px 16px 40px; }
  .cmp, .ba { grid-template-columns: 1fr; }
  .hide-sm { display: none; }
}
</style>
</head>

  <nav id="tabs">

    <div id="c-list"></div>

  <section id="duplicates">
    <div class="filters">
      <input type="search" id="d-q" placeholder="Search method, class, author...">
      <select id="d-level"><option value="">All levels</option></select>
    </div>
    <div id="d-list"></div>
  </section>
  <section id="recommendations">
    <div class="filters">
      <input type="search" id="r-q" placeholder="Search message, class, method, file...">
      <select id="r-sev"><option value="">All severities</option></select>
      <select id="r-cat"><option value="">All categories</option></select>
      <select id="r-rule"><option value="">All rules</option></select>
      <select id="r-author"><option value="">All authors</option></select>
    </div>
    <div id="r-summary"></div>
    <div id="r-list"></div>
  </section>
</main>

,"source":"@Then(\"the user name is {string}\")\npublic void userNameIs(String name) {\n    assertEquals(response.jsonPath().getString(\"name\"), name);\n}","javadoc":null,"stepKeyword":"Then","stepText":"the user name is {string}","actions":[{"type":"ASSERT","verb":"assertEquals","target":"?","line":22,"selectorArg":false}],"description":"Step \"Then the user name is {string}\": asserts (assertEquals).","descriptionSource":"STEP","purpose":"Step definition","callCount":0,"stepUsageCount":1,"authors":[],"step":true}]}],"duplicateGroups":[{"number":1,"level":"EXACT","levelLabel":"Exact copy","levelMeaning":"Same code; only formatting or comments differ.","memberIds":["com.legacy.framework.utils.CommonUtils#formatDate(Date)","com.legacy.framework.utils.DateUtil#formatDate(Date)"],"keepId":"com.legacy.framework.utils.CommonUtils#formatDate(Date)","keepReason":"public, in a shared class (CommonUtils)","removableLines":6,"pairs":[{"a":"com.legacy.framework.utils.CommonUtils#formatDate(Date)","b":"com.legacy.framework.utils.DateUtil#formatDate(Date)","level":"EXACT","similarity":1.0}]},{"number":2,"level":"RENAMED","levelLabel":"Renamed copy","levelMeaning":"Same code structure; variable, parameter or field names and literal values differ.","memberIds":["com.legacy.framework.utils.StringHelper#randomText(int)","com.legacy.framework.utils.CommonUtils#generateRandomString(int)"],"keepId":"com.legacy.framework.utils.StringHelper#randomText(int)","keepReason":"documented, public, in a shared class (StringHelper)","removableLines":9,"pairs":[{"a":"com.legacy.framework.utils.CommonUtils#generateRandomString(int)","b":"com.legacy.framework.utils.StringHelper#randomText(int)","level":"RENAMED","similarity":1.0}]},{"number":3,"level":"SAME_JOB","levelLabel":"Same job","levelMeaning":"Different code, but the same UI/API actions on the same elements or endpoints, in the same order.","memberIds":["com.legacy.framework.pages.LoginPage#login(String,String)","com.legacy.framework.steps.LoginSteps#iSignIn(String,String)","com.legacy.framework.utils.LoginHelper#doSignIn(Page,String,String)","com.legacy.framework.utils.LoginHelper#loginAsAdmin(Page)"],"keepId":"com.legacy.framework.pages.LoginPage#login(String,String)","keepReason":"most calls (1), documented, public","removableLines":20,"pairs":[{"a":"com.legacy.framework.utils.LoginHelper#doSignIn(Page,String,String)","b":"com.legacy.framework.utils.LoginHelper#loginAsAdmin(Page)","level":"SAME_JOB","similarity":1.0},{"a":"com.legacy.framework.pages.LoginPage#login(String,String)","b":"com.legacy.framework.utils.LoginHelper#doSignIn(Page,String,String)","level":"SAME_JOB","similarity":1.0},{"a":"com.legacy.framework.utils.LoginHelper#doSignIn(Page,String,String)","b":"com.legacy.framework.steps.LoginSteps#iSignIn(String,String)","level":"SAME_JOB","similarity":1.0},{"a":"com.legacy.framework.pages.LoginPage#login(String,String)","b":"com.legacy.framework.utils.LoginHelper#loginAsAdmin(Page)","level":"SAME_JOB","similarity":1.0},{"a":"com.legacy.framework.utils.LoginHelper#loginAsAdmin(Page)","b":"com.legacy.framework.steps.LoginSteps#iSignIn(String,String)","level":"SAME_JOB","similarity":1.0},{"a":"com.legacy.framework.pages.LoginPage#login(String,String)","b":"com.legacy.framework.steps.LoginSteps#iSignIn(String,String)","level":"SAME_JOB","similarity":1.0}]},{"number":4,"level":"SAME_JOB","levelLabel":"Same job","levelMeaning":"Different code, but the same UI/API actions on the same elements or endpoints, in the same order.","memberIds":["com.legacy.framework.api.UserApi#getUser(String)","com.legacy.framework.api.UserService#fetchUser(String)"],"keepId":"com.legacy.framework.api.UserApi#getUser(String)","keepReason":"most calls (1), documented, public","removableLines":11,"pairs":[{"a":"com.legacy.framework.api.UserApi#getUser(String)","b":"com.legacy.framework.api.UserService#fetchUser(String)","level":"SAME_JOB","similarity":1.0}]}],"rules":[{"id":"CLASS_NAMING","title":"Class names in PascalCase","category":"Naming","severity":"LOW","why":"Java classes are named in PascalCase (LoginPage, UserApiClient). Other styles make classes look like variables or constants and make the code base harder to search.","before":"public class login_page { }\npublic class userapi { }","after":"public class LoginPage { }\npublic class UserApi { }"},{"id":"METHOD_NAMING","title":"Method names in camelCase","category":"Naming","severity":"LOW","why":"Methods are named in camelCase, starting lower case (clickLogin). Underscores, upper-case starts and all-caps names hide which methods exist when people search for one to reuse.","before":"public void Click_Login() { ... }\npublic void ENTERUSER(String u) { ... }","after":"public void clickLogin() { ... }\npublic void enterUsername(String username) { ... }"},{"id":"CONSTANT_NAMING","title":"Constants in UPPER_SNAKE_CASE","category":"Naming","severity":"LOW","why":"static final values are constants and are named in UPPER_SNAKE_CASE, so a reader sees at once that the value never changes and can be shared.","before":"private static final String loginUrl = \"/login\";\nstatic final int timeout = 30;","after":"private static final String LOGIN_URL = \"/login\";\nstatic final int TIMEOUT_SECONDS = 30;"},{"id":"VARIABLE_NAMING","title":"Fields, parameters and variables in camelCase","category":"Naming","severity":"LOW","why":"Fields, parameters and local variables are named in camelCase. Underscores and upper-case names look like constants or classes.","before":"String User_Name = \"ada\";\nLocator Submit_Btn = page.locator(\"#submit\");","after":"String userName = \"ada\";\nLocator submitButton = page.locator(\"#submit\");"},{"id":"PACKAGE_NAMING","title":"Package names in lower case","category":"Naming","severity":"LOW","why":"Package names are all lower case (com.company.pages). Mixed case breaks on case-insensitive file systems (Windows, macOS) and differs from every library you use.","before":"package com.company.Pages;\npackage com.company.API_Utils;","after":"package com.company.pages;\npackage com.company.api.utils;"},{"id":"NON_DESCRIPTIVE_NAME","title":"Names that say what the method does","category":"Naming","severity":"MEDIUM","why":"Names such as test1, method2, doIt or temp say nothing about what the method does. Nobody finds them when looking for something to reuse, so they write a new one: this is how duplicate methods start.","before":"public void method2() { /* logs in */ }\npublic String temp(String s) { /* trims, lower-cases */ }","after":"public void logInAs(User user) { ... }\npublic String normaliseEmail(String email) { ... }"},{"id":"METHOD_NAME_VERB","title":"Method names start with a verb","category":"Naming","severity":"INFO","why":"A method does something, so its name starts with a verb (clickSave, getTotal, isVisible). Consistent verbs (click, enter, select, get, verify) make methods easy to find with auto-complete.","before":"public void loginButton() { ... }\npublic void userDetails(String id) { ... }","after":"public void clickLoginButton() { ... }\npublic UserDetails fetchUserDetails(String id) { ... }"},{"id":"HARD_WAIT","title":"No fixed waits (Thread.sleep, waitForTimeout)","category":"Synchronisation","severity":"HIGH","why":"A fixed wait is either too short (the test fails when the app is slow: flaky) or too long (every run is slower). Playwright already waits for elements before acting, and web-first assertions retry until the condition holds.","before":"page.locator(\"#save\").click();\nThread.sleep(5000);\nString msg = page.locator(\".toast\").textContent();","after":"page.locator(\"#save\").click();\nassertThat(page.locator(\".toast\")).hasText(\"Saved\"); // retries up to the timeout"},{"id":"PLAYWRIGHT_DEPRECATED_API","title":"No deprecated Playwright APIs","category":"Playwright","severity":"MEDIUM","why":"Deprecated methods (waitForNavigation, type, waitForSelector) are racy or will be removed. Their replacements wait for the right condition.","before":"page.waitForNavigation(() -> page.click(\"#next\"));\npage.locator(\"#q\").type(\"shoes\");","after":"page.locator(\"#next\").click();\npage.waitForURL(\"**/step-2\");\npage.locator(\"#q\").fill(\"shoes\");"},{"id":"PLAYWRIGHT_PAGE_SELECTOR_METHOD","title":"Use locators instead of page.click(selector)","category":"Playwright","severity":"LOW","why":"page.click(selector), page.fill(selector, ...) and similar are discouraged: a Locator is defined once (in the page object), re-resolved on every use and works with web-first assertions.","before":"page.fill(\"#username\", user);\npage.click(\"#login\");","after":"private final Locator username = page.locator(\"#username\");\nprivate final Locator login = page.locator(\"#login\");\n\nusername.fill(user);\nlogin.click();"},{"id":"LONG_METHOD","title":"Short methods that do one thing","category":"Design","severity":"MEDIUM","why":"A long method usually does several things (log in, search, check the result). Each part cannot be reused on its own, so people copy the part they need: duplicates. Split it into named steps.","before":"public void placeOrder() {\n    // 80 lines: log in, search, add to cart, pay, check confirmation\n}","after":"public void placeOrder(User user, Product product) {\n    loginPage.logInAs(user);\n    searchPage.search(product.name());\n    cartPage.add(product);\n    checkoutPage.pay(user.card());\n}"},{"id":"TOO_MANY_PARAMETERS","title":"Few parameters: group them in an object","category":"Design","severity":"MEDIUM","why":"With many parameters, callers mix up their order (two Strings swap without any error) and every new field changes every caller. A record or a builder names each value.","before":"public void createUser(String first, String last, String email, String phone, String city, boolean admin) { ... }","after":"public record NewUser(String first, String last, String email, String phone, String city, boolean admin) {}\n\npublic void createUser(NewUser user) { ... }\n// or: NewUser.builder().first(\"Ada\").email(\"ada@x.test\").build()"},{"id":"GOD_CLASS","title":"Classes with one responsibility","category":"Design","severity":"MEDIUM","why":"A class with very many methods (CommonUtils, BaseTest with everything) is a place where people add instead of search. Split it by topic: DateUtils, StringUtils, page objects per page.","before":"public class CommonUtils { // 120 methods: dates, strings, files, waits, API calls\n}","after":"public final class DateUtils { ... }\npublic final class FileUtils { ... }\npublic class CheckoutPage { ... }"},{"id":"STATIC_MUTABLE_STATE","title":"No static mutable Playwright/REST state","category":"Design","severity":"HIGH","why":"A static non-final Page, Browser, RequestSpecification, Response or collection is shared by all tests. When tests run in parallel they overwrite each other's browser or response: random failures. Give each scenario its own instance (dependency injection such as PicoContainer, or ThreadLocal).","before":"public class DriverFactory {\n    public static Page page;\n    public static Response lastResponse;\n}","after":"public class TestContext {          // one per scenario (PicoContainer)\n    private final Page page;\n    private Response lastResponse;\n}\n// or: private static final ThreadLocal\u003cPage> PAGE = new ThreadLocal\u003c>();"},{"id":"UTILITY_CLASS_INSTANTIABLE","title":"Utility classes are final with a private constructor","category":"Java idioms","severity":"LOW","why":"A class with only static methods is never meant to be created or extended. Make it final with a private constructor, so nobody writes new CommonUtils() or a subclass.","before":"public class StringUtils {\n    public static String trim(String s) { ... }\n}","after":"public final class StringUtils {\n    private StringUtils() {}\n    public static String trim(String s) { ... }\n}"},{"id":"HARDCODED_URL","title":"No hard-coded URLs","category":"Configuration","severity":"MEDIUM","why":"A URL in code ties the tests to one environment. Read base URLs from configuration (per environment) and keep only the path in code.","before":"page.navigate(\"https://qa.myapp.com/login\");\ngiven().baseUri(\"https://qa-api.myapp.com\")","after":"page.navigate(config.uiBaseUrl() + \"/login\");\ngiven().spec(apiSpec)   // base URI from config"},{"id":"REPEATED_LITERAL","title":"Repeated strings as constants or enums","category":"Java idioms","severity":"LOW","why":"The same string written many times (a status, a header name, a role) is easy to mistype and hard to change. Use a constant, or an enum when it is one of a fixed set of values.","before":"if (status.equals(\"ACTIVE\")) ...\nuser.setStatus(\"ACTIVE\");\nassertEquals(\"ACTIVE\", body.status);","after":"public enum Status { ACTIVE, INACTIVE }\n\nif (status == Status.ACTIVE) ...\nuser.setStatus(Status.ACTIVE);"},{"id":"LOCATOR_IN_STEP_DEFINITION","title":"No locators in step definitions","category":"Test design","severity":"MEDIUM","why":"Step definitions describe behaviour; page objects know the page. Locators in steps are copied to every step that touches the element, and a changed id must be fixed in many places.","before":"@When(\"I log in as {string}\")\npublic void logIn(String user) {\n    page.locator(\"#user\").fill(user);\n    page.locator(\"#login\").click();\n}","after":"@When(\"I log in as {string}\")\npublic void logIn(String user) {\n    loginPage.logInAs(user);   // locators live in LoginPage\n}"},{"id":"DUPLICATE_LOCATOR","title":"One locator, one place","category":"Test design","severity":"MEDIUM","why":"The same selector defined in several classes is a duplicate in disguise: when the page changes, some copies get fixed and others do not. Define it once in the page object (or a locator file) and reuse it.","before":"// LoginPage\npage.locator(\"#login-btn\").click();\n// HeaderSteps\npage.locator(\"#login-btn\").click();","after":"// LoginPage\npublic Locator loginButton() { return page.locator(\"#login-btn\"); }\n// HeaderSteps\nloginPage.loginButton().click();"},{"id":"THEN_STEP_WITHOUT_ASSERTION","title":"Then steps assert something","category":"Test design","severity":"MEDIUM","why":"A Then step that does not assert passes whatever the application does, so the scenario can never fail on it.","before":"@Then(\"the order is confirmed\")\npublic void orderConfirmed() {\n    confirmationPage.getMessage();\n}","after":"@Then(\"the order is confirmed\")\npublic void orderConfirmed() {\n    assertThat(confirmationPage.message()).hasText(\"Thank you\");\n}"},{"id":"TEST_WITHOUT_ASSERTION","title":"Tests assert something","category":"Test design","severity":"MEDIUM","why":"A @Test without any assertion only checks that nothing threw an exception.","before":"@Test\npublic void searchWorks() {\n    searchPage.search(\"shoes\");\n}","after":"@Test\npublic void searchFindsProducts() {\n    searchPage.search(\"shoes\");\n    assertThat(searchPage.results()).not().hasCount(0);\n}"},{"id":"BRITTLE_XPATH","title":"No absolute or positional XPath","category":"Test design","severity":"MEDIUM","why":"/html/body/div[2]/div[1]/button breaks with every layout change. Prefer user-facing locators (getByRole, getByLabel, getByTestId) or a stable id.","before":"page.locator(\"/html/body/div[2]/div[1]/form/button[2]\").click();","after":"page.getByRole(AriaRole.BUTTON, new Page.GetByRoleOptions().setName(\"Save\")).click();\npage.getByTestId(\"save-button\").click();"},{"id":"UNUSED_STEP_DEFINITION","title":"No unused step definitions","category":"Test design","severity":"LOW","why":"A step definition that no feature file uses is dead code, and often an old copy of a step that is written differently now. Delete it or reuse it.","before":"@When(\"user clicks on login button\")   // no feature uses this any more\npublic void clickLogin() { ... }","after":"// deleted; features use: When I log in as \"ada\""},{"id":"REST_REPEATED_REQUEST_SETUP","title":"Shared request setup with RequestSpecBuilder","category":"REST Assured","severity":"MEDIUM","why":"Base URI, content type, auth and common headers written in every request method are copies: a new header must be added everywhere. Build one RequestSpecification and reuse it with spec(...).","before":"given().baseUri(\"https://api.x\").contentType(ContentType.JSON).header(\"X-Key\", key)\n    .get(\"/users/1\");\ngiven().baseUri(\"https://api.x\").contentType(ContentType.JSON).header(\"X-Key\", key)\n    .get(\"/orders/7\");","after":"RequestSpecification api = new RequestSpecBuilder()\n    .setBaseUri(config.apiBaseUrl()).setContentType(ContentType.JSON)\n    .addHeader(\"X-Key\", key).build();\n\ngiven().spec(api).get(\"/users/1\");\ngiven().spec(api).get(\"/orders/7\");"},{"id":"REST_RESPONSE_NOT_CHECKED","title":"Check the response of a request","category":"REST Assured","severity":"MEDIUM","why":"A method that sends a request, does not check it and does not return it hides errors: a 500 or 401 goes unnoticed. Check the status (or return the response so the caller checks it).","before":"public void deleteUser(String id) {\n    given().spec(api).delete(\"/users/\" + id);\n}","after":"public void deleteUser(String id) {\n    given().spec(api).delete(\"/users/\" + id)\n        .then().statusCode(204);\n}"},{"id":"EMPTY_CATCH","title":"No empty catch blocks","category":"Error handling","severity":"HIGH","why":"An empty catch hides the failure: the test goes on in a wrong state and fails later with a misleading error, or passes when it should fail.","before":"try {\n    page.locator(\"#cookie-ok\").click();\n} catch (Exception e) {\n}","after":"// only if the banner is really optional:\nLocator ok = page.locator(\"#cookie-ok\");\nif (ok.isVisible()) ok.click();"},{"id":"BROAD_CATCH_SWALLOWED","title":"Do not swallow broad exceptions","category":"Error handling","severity":"MEDIUM","why":"catch (Exception e) that only logs turns every problem (a typo, a timeout, a 500) into a passing step. Catch the specific exception you expect, or let it fail the test.","before":"try {\n    api.createUser(user);\n} catch (Exception e) {\n    System.out.println(\"failed\");\n}","after":"api.createUser(user);   // let it fail the step\n// or catch only what you expect:\ncatch (TimeoutError e) { ... }"},{"id":"PRINT_STACK_TRACE","title":"Log exceptions instead of printStackTrace","category":"Logging","severity":"LOW","why":"printStackTrace writes to stderr, outside the test report and without the scenario name; in parallel runs the traces of different tests mix.","before":"catch (IOException e) {\n    e.printStackTrace();\n}","after":"catch (IOException e) {\n    throw new UncheckedIOException(\"Cannot read \" + file, e);\n}"},{"id":"SYSTEM_OUT","title":"Use a logger instead of System.out","category":"Logging","severity":"LOW","why":"System.out cannot be filtered by level, has no time or thread, and does not reach the test report. A logger (SLF4J) or the report API (scenario.log) does.","before":"System.out.println(\"Clicked login\");","after":"private static final Logger LOG = LoggerFactory.getLogger(LoginPage.class);\n\nLOG.info(\"Clicked login\");"},{"id":"STRING_IF_CHAIN","title":"Enum and switch instead of if-else on strings","category":"Java idioms","severity":"LOW","why":"A chain of if (x.equals(\"chrome\")) else if (x.equals(\"firefox\")) ... accepts any typo and grows in every copy. An enum lists the allowed values once, and a switch expression on it is checked by the compiler.","before":"if (browser.equals(\"chrome\")) { ... }\nelse if (browser.equals(\"firefox\")) { ... }\nelse if (browser.equals(\"webkit\")) { ... }","after":"enum BrowserName { CHROME, FIREFOX, WEBKIT }\n\nBrowser b = switch (BrowserName.valueOf(name.toUpperCase())) {\n    case CHROME -> playwright.chromium().launch();\n    case FIREFOX -> playwright.firefox().launch();\n    case WEBKIT -> playwright.webkit().launch();\n};"},{"id":"RETURN_NULL","title":"Optional instead of returning null","category":"Java idioms","severity":"LOW","why":"A method that returns null for \"not found\" forces every caller to remember a null check; a forgotten one is a NullPointerException far from the cause. Optional says it in the signature.","before":"public User findUser(String name) {\n    ...\n    return null;\n}","after":"public Optional\u003cUser> findUser(String name) {\n    ...\n    return Optional.empty();\n}\n\nfindUser(\"ada\").orElseThrow(() -> new IllegalStateException(\"No user ada\"));"},{"id":"STRING_CONCAT_IN_LOOP","title":"StringBuilder or String.join in loops","category":"Java idioms","severity":"LOW","why":"s += x in a loop creates a new string every time. StringBuilder, String.join or Collectors.joining are faster and clearer.","before":"String names = \"\";\nfor (User u : users) {\n    names += u.name() + \",\";\n}","after":"String names = users.stream().map(User::name).collect(Collectors.joining(\",\"));"}],"findings":[{"ruleId":"STATIC_MUTABLE_STATE","severity":"HIGH","file":"src/main/java/com/legacy/framework/utils/CommonUtils.java","line":16,"className":"CommonUtils","methodName":null,"message":"static Page page is shared by every test thread.","author":null},{"ruleId":"HARD_WAIT","severity":"HIGH","file":"src/main/java/com/legacy/framework/utils/CommonUtils.java","line":38,"className":"CommonUtils","methodName":"waitFor","message":"Thread.sleep(...) waits a fixed time. Wait for a condition instead (locator.waitFor, assertThat(...), page.waitForURL).","author":null},{"ruleId":"HARD_WAIT","severity":"HIGH","file":"src/main/java/com/legacy/framework/utils/LoginHelper.java","line":15,"className":"LoginHelper","methodName":"doSignIn","message":"Thread.sleep(3000) waits a fixed time. Wait for a condition instead (locator.waitFor, assertThat(...), page.waitForURL).","author":null},{"ruleId":"EMPTY_CATCH","severity":"HIGH","file":"src/main/java/com/legacy/framework/utils/LoginHelper.java","line":16,"className":"LoginHelper","methodName":"doSignIn","message":"catch (InterruptedException) is :"CommonUtils","methodName":"joinNames","message":"result += ... inside a loop.","author":null},{"ruleId":"REPEATED_LITERAL","severity":"LOW","file":"src/main/java/com/legacy/framework/utils/CommonUtils.java","line":75,"className":"CommonUtils","methodName":"method2","message":"\"ACTIVE\" is written 3 times in CommonUtils; make it a constant or enum value.","author":null},{"ruleId":"SYSTEM_OUT","severity":"LOW","file":"src/main/java/com/legacy/framework/utils/CommonUtils.java","line":76,"className":"CommonUtils","methodName":"method2","message":"System.out.println(...) instead of a logger.","author":null},{"ruleId":"SYSTEM_OUT","severity":"LOW","file":"src/main/java/com/legacy/framework/utils/CommonUtils.java","line":78,"className":"CommonUtils","methodName":"method2","message":"System.out.println(...) instead of a logger.","author":null},{"ruleId":"UTILITY_CLASS_INSTANTIABLE","severity":"LOW","file":"src/main/java/com/legacy/framework/utils/DateUtil.java","line":6,"className":"DateUtil","methodName":null,"message":"DateUtil has only static methods: make it final and add a private constructor.","author":null},{"ruleId":"SYSTEM_OUT","severity":"LOW","file":"src/main/java/com/legacy/framework/utils/DateUtil.java","line":12,"className":"DateUtil","methodName":"formatDate","message":"System.out.println(...) instead of a logger.","author":null},{"ruleId":"UTILITY_CLASS_INSTANTIABLE","severity":"LOW","file":"src/main/java/com/legacy/framework/utils/LoginHelper.java","line":8,"className":"LoginHelper","methodName":null,"message":"LoginHelper has only static methods: make it final and add a private constructor.","author":null},{"ruleId":"PLAYWRIGHT_PAGE_SELECTOR_METHOD","severity":"LOW","file":"src/main/java/com/legacy/framework/utils/LoginHelper.java","line":11,"className":"LoginHelper","methodName":"doSignIn","message":"page.fill(\"#username\", ...) takes a selector; define a Locator and call fill() on it.","author":null},{"ruleId":"PLAYWRIGHT_PAGE_SELECTOR_METHOD","sever <script>
(function () {
  "use strict";
  var D = JSON.parse(document.getElementById("scan-data").textContent);
  var SEV = ["HIGH", "MEDIUM", "LOW", "INFO"];
  var methods = [], byId = {}, dupOf = {};
  D.classes.forEach(function (c) { c.methods.forEach(function (m) { m.cls = c; methods.push(m); byId[m.id] = m; }); });
  D.duplicateGroups.forEach(function (g) { g.memberIds.forEach(function (id) { dupOf[id] = g; }); });
  var rules = {}; D.rules.forEach(function (r) { rules[r.id] = r; });

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (ch) { return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[ch]; }); }
  function $(id) { return document.getElementById(id); }
  function el(html) { var t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstChild; }
  function count(list, key) { var m = {}; list.forEach(function (x) { var k = key(x); if (k == null || k === "") return; m[k] = (m[k] || 0) + 1; }); return m; }
  function sortedEntries(m) { return Object.keys(m).map(function (k) { return [k, m[k]]; }).sort(function (a, b) { return b[1] - a[1] || (a[0] < b[0] ? -1 : 1); }); }
  function pct(a, b) { return b ? Math.round(100 * a / b) + "%" : "0%"; }
  function author(m) { return m.authors && m.authors.length ? m.authors[0] : ""; }
  function isUnused(m) {
    if (m.stepText != null) return m.stepUsageCount === 0;
    var a = m.annotations || [];
    if (a.indexOf("Test") >= 0 || a.indexOf("Override") >= 0 || m.name === "main") return false;
    if (a.some(function (x) { return x.indexOf("Before") === 0 || x.indexOf("After") === 0; })) return false;
    return m.callCount === 0;
  }
  function options(select, values) { values.forEach(function (v) { var o = document.createElement("option"); o.value = v[0]; o.textContent = v[1] || v[0]; select.appendChild(o); }); }
  function debounce(f) { var t; return function () { clearTimeout(t); t = setTimeout(f, 120); }; }
  function loc(file, line) { return esc(file) + ":" + line; }

  // ---------- theme ----------
  (function () {
    var saved = null; try { saved = localStorage.getItem("scan-theme"); } catch (e) {}
    if (saved) document.documentElement.setAttribute("data-theme", saved);
    $("themeBtn").addEventListener("click", function () {
      var cur = document.documentElement.getAttribute("data-theme");
      var dark = cur ? cur === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
      var next = dark ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      try { localStorage.setItem("scan-theme", next); } catch (e) {}
    });
  })();

  // ---------- header + tabs ----------
  $("title").textContent = D.projectName + " — scan report";
  document.title = D.projectName + " scan";
  $("meta").textContent = "Scanned " + D.scannedAt + " · " + D.filesScanned + " files · " + D.projectRoot
    + (D.includePackages && D.includePackages.length ? " · packages: " + D.includePackages.join(", ") : " · all packages");
  $("n-catalog").textContent = methods.length;
  $("n-duplicates").textContent = D.duplicateGroups.length;
  $("n-recs").textContent = D.findings.length;
  function showTab() {
    var tab = (location.hash || "#overview").slice(1);
    if (!$(tab)) tab = "overview";
    document.querySelectorAll("main > section").forEach(function (s) { s.classList.toggle("active", s.id === tab); });
    document.querySelectorAll("#tabs a").forEach(function (a) { a.classList.toggle("active", a.dataset.tab === tab); });
  }
  window.addEventListener("hashchange", showTab);
  showTab();

  // ---------- overview ----------
  (function () {
    var documented = methods.filter(function (m) { return m.javadoc; }).length;
    var unused = methods.filter(isUnused).length;
    var inDup = D.duplicateGroups.reduce(function (s, g) { return s + g.memberIds.length; }, 0);
    var removable = D.duplicateGroups.reduce(function (s, g) { return s + g.removableLines; }, 0);
    var sev = count(D.findings, function (f) { return f.severity; });
    var tiles = [
      [D.classes.length, "Classes"], [methods.length, "Methods"], [pct(documented, methods.length), "Methods with Javadoc"],
      [unused, "Never called"], [D.duplicateGroups.length, "Duplicate groups"], [inDup, "Methods in duplicates"],
      [removable, "Lines removable"], [(sev.HIGH || 0), "High findings"], [D.findings.length, "All recommendations"]];
    var html = "<h2>Summary</h2><div class='tiles'>" + tiles.map(function (t) {
      return "<div class='tile'><div class='v'>" + esc(t[0]) + "</div><div class='l'>" + esc(t[1]) + "</div></div>"; }).join("") + "</div>";

    function barTable(title, entries, link) {
      if (!entries.length) return "<div class='card'><h2>" + esc(title) + "</h2><div class='empty'>Nothing to show.</div></div>";
      var max = entries[0][1];
      return "<div class='card'><h2>" + esc(title) + "</h2><table>" + entries.slice(0, 12).map(function (e) {
        return "<tr" + (link ? " class='clickable' data-go='" + esc(link(e[0])) + "'" : "") + "><td>" + esc(e[0]) + "</td><td style='width:45%'><div class='bar' style='width:"
          + Math.max(2, 100 * e[1] / max) + "%'></div></td><td class='num'>" + e[1] + "</td></tr>"; }).join("") + "</table></div>";
    }
    var roles = sortedEntries(count(D.classes, function (c) { return c.role; }));
    var purposes = sortedEntries(count(methods, function (m) { return m.purpose; }));
    var levels = sortedEntries(count(D.duplicateGroups, function (g) { return g.levelLabel; }));
    var topRules = sortedEntries(count(D.findings, function (f) { return rules[f.ruleId].title; }));
    var dupAuthors = sortedEntries(count(D.duplicateGroups.reduce(function (a, g) { return a.concat(g.memberIds.slice(1)); }, []),
      function (id) { return author(byId[id]) || null; }));
    var srcs = count(methods, function (m) { return {JAVADOC: "From Javadoc", STEP: "From step text + code", CODE: "Generated from code", NAME: "Generated from name only"}[m.descriptionSource]; });
    html += "<div class='grid2' style='margin-top:16px'>"
      + barTable("Classes by role", roles, function (k) { return "catalog|role|" + k; })
      + barTable("Methods by purpose", purposes, function (k) { return "catalog|purpose|" + k; })
      + barTable("Duplicate groups by level", levels, function (k) { return "duplicates|level|" + k; })
      + barTable("Top recommendations", topRules, null)
      + barTable("Where descriptions come from", sortedEntries(srcs), null)
      + (dupAuthors.length ? barTable("Duplicate copies by author", dupAuthors, null) : "")
      + "</div>";
    if (D.parseErrors && D.parseErrors.length) {
      html += "<div class='card'><h2>Files that could not be parsed (" + D.parseErrors.length + ")</h2><ul class='small'>"
        + D.parseErrors.map(function (e) { return "<li>" + esc(e) + "</li>"; }).join("") + "</ul></div>";
    }
    $("overview").innerHTML = html;
    $("overview").addEventListener("click", function (ev) {
      var tr = ev.target.closest("[data-go]"); if (!tr) return;
      var p = tr.dataset.go.split("|");
      if (p[0] === "catalog") { $(p[1] === "role" ? "c-role" : "c-purpose").value = p[2]; renderCatalog(); }
      if (p[0] === "duplicates") { $("d-level").value = p[2]; renderDuplicates(); }
      location.hash = "#" + p[0];
    });
  })();

  // ---------- catalog ----------
  options($("c-role"), Object.keys(count(D.classes, function (c) { return c.role; })).sort().map(function (k) { return [k]; }));
  options($("c-purpose"), Object.keys(count(methods, function (m) { return m.purpose; })).sort().map(function (k) { return [k]; }));
  options($("c-pkg"), Object.keys(count(D.classes, function (c) { return c.packageName || "(default)"; })).sort().map(function (k) { return [k]; }));

  function actionText(a) {
    var t = a.target === "?" ? "<span class='muted'>(runtime value)</span>" : "<code>" + esc(a.target) + "</code>";
    return "<span class='chip'>" + esc(a.type.replace("_", " ").toLowerCase()) + "</span> " + esc(a.verb) + " " + t + " <span class='muted small'>line " + a.line + "</span>";
  }
  function methodDetail(m) {
    var g = dupOf[m.id];
    return "<div><div class='small muted'>" + loc(m.file, m.beginLine) + " · " + m.lines() + "</div>"
      + "<div><code>" + esc(m.signature) + "</code></div>"
      + (m.stepText != null ? "<div style='margin-top:4px'><span class='chip'>" + esc(m.stepKeyword) + "</span> <code>" + esc(m.stepText) + "</code> · used in "
          + (m.stepUsageCount < 0 ? "?" : m.stepUsageCount) + " feature step(s)</div>" : "")
      + (g ? "<div style='margin-top:4px'>In duplicate group <a href='#duplicates' data-group='" + g.number + "'>#" + g.number + " (" + esc(g.levelLabel) + ")</a></div>" : "")
      + (m.authors && m.authors.length ? "<div class='small muted'>Authors: " + esc(m.authors.join(", ")) + "</div>" : "")
      + (m.actions.length ? "<div style='margin-top:6px'><b>What it does</b><ol class='actions'>" + m.actions.map(function (a) { return "<li>" + actionText(a) + "</li>"; }).join("") + "</ol></div>" : "")
      + "<pre>" + esc(m.source) + "</pre></div>";
  }
  methods.forEach(function (m) { m.lines = function () { return (m.endLine - m.beginLine + 1) + " lines"; }; });

  function renderCatalog() {
    var q = $("c-q").value.trim().toLowerCase(), role = $("c-role").value, purpose = $("c-purpose").value, pkg = $("c-pkg").value;
    var onlyUnused = $("c-unused").checked, onlyNoDoc = $("c-nodoc").checked, onlyDup = $("c-dup").checked;
    var shown = 0, html = [];
    D.classes.forEach(function (c, ci) {
      if (role && c.role !== role) return;
      if (pkg && (c.packageName || "(default)") !== pkg) return;
      var classHit = q && (c.name.toLowerCase().indexOf(q) >= 0 || (c.javadoc || "").toLowerCase().indexOf(q) >= 0);
      var ms = c.methods.filter(function (m) {
        if (purpose && m.purpose !== purpose) return false;
        if (onlyUnused && !isUnused(m)) return false;
        if (onlyNoDoc && m.javadoc) return false;
        if (onlyDup && !dupOf[m.id]) return false;
        if (!q || classHit) return true;
        var hay = (m.name + " " + m.description + " " + (m.stepText || "") + " " + m.signature + " "
          + m.actions.map(function (a) { return a.target; }).join(" ")).toLowerCase();
        return hay.indexOf(q) >= 0;
      });
      if (!ms.length) return;
      shown += ms.length;
      html.push("<details class='cls'" + (q || D.classes.length <= 15 ? " open" : "") + "><summary><b>" + esc(c.name) + "</b> <span class='chip'>" + esc(c.role)
        + "</span> <span class='muted small'>" + esc(c.packageName) + " · " + esc(c.file) + " · " + ms.length + " method(s)</span>"
        + (c.javadoc ? "<span class='small' style='flex-basis:100%'>" + esc(c.javadoc) + "</span>" : "") + "</summary>"
        + "<div class='table-wrap'><table><thead><tr><th>Method</th><th>What it does</th><th class='hide-sm'>Purpose</th><th class='num'>Calls</th><th class='hide-sm'>Author</th></tr></thead><tbody>"
        + ms.map(function (m) {
          var calls = m.stepText != null ? (m.stepUsageCount < 0 ? "?" : m.stepUsageCount) + " <span class='muted small'>steps</span>" : m.callCount;
          return "<tr class='mrow' data-id='" + esc(m.id) + "'><td><span class='mname'>" + esc(m.name) + "</span><div class='muted small'>(" + esc(m.parameterTypes.join(", ")) + ") → " + esc(m.returnType) + "</div></td>"
            + "<td>" + esc(m.description) + (m.descriptionSource !== "JAVADOC" ? " <span class='chip' title='Generated by the scanner: no Javadoc'>generated</span>" : "")
            + (dupOf[m.id] ? " <span class='chip lvl'>duplicate #" + dupOf[m.id].number + "</span>" : "")
            + (isUnused(m) ? " <span class='chip sev-MEDIUM'>never called</span>" : "") + "</td>"
            + "<td class='hide-sm'><span class='chip'>" + esc(m.purpose) + "</span></td><td class='num'>" + calls + "</td><td class='hide-sm small'>" + esc(author(m)) + "</td></tr>";
        }).join("") + "</tbody></table></div></details>");
    });
    $("c-count").textContent = shown + " of " + methods.length + " methods";
    $("c-list").innerHTML = html.length ? html.join("") : "<div class='empty'>No method matches the filters.</div>";
  }
  ["c-q"].forEach(function (id) { $(id).addEventListener("input", debounce(renderCatalog)); });
  ["c-role", "c-purpose", "c-pkg", "c-unused", "c-nodoc", "c-dup"].forEach(function (id) { $(id).addEventListener("change", renderCatalog); });
  $("c-list").addEventListener("click", function (ev) {
    var link = ev.target.closest("[data-group]");
    if (link) { $("d-q").value = ""; $("d-level").value = ""; renderDuplicates(); setTimeout(function () { var g = $("group-" + link.dataset.group); if (g) g.scrollIntoView(); }, 0); return; }
    var tr = ev.target.closest(".mrow"); if (!tr) return;
    var next = tr.nextElementSibling;
    if (next && next.classList.contains("detail")) { next.remove(); return; }
    var d = el("<tr class='detail'><td colspan='5'></td></tr>");
    d.firstChild.innerHTML = methodDetail(byId[tr.dataset.id]);
    tr.after(d);
  });
  renderCatalog();

  // ---------- duplicates ----------
  options($("d-level"), Object.keys(count(D.duplicateGroups, function (g) { return g.levelLabel; })).map(function (k) { return [k]; }));

  function norm(line) { return line.trim().replace(/\s+/g, " "); }
  function diff(a, b) {
    var A = a.split("\n"), B = b.split("\n"), n = A.length, m = B.length, i, j;
    var L = []; for (i = 0; i <= n; i++) { L.push(new Array(m + 1).fill(0)); }
    for (i = n - 1; i >= 0; i--) for (j = m - 1; j >= 0; j--) L[i][j] = norm(A[i]) === norm(B[j]) ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
    var left = [], right = []; i = 0; j = 0;
    while (i < n || j < m) {
      if (i < n && j < m && norm(A[i]) === norm(B[j])) { left.push([A[i], ""]); right.push([B[j], ""]); i++; j++; }
      else if (j < m && (i >= n || L[i][j + 1] >= L[i + 1][j])) { left.push(["", "d-gap"]); right.push([B[j], "d-add"]); j++; }
      else { left.push([A[i], "d-del"]); right.push(["", "d-gap"]); i++; }
    }
    function render(rows) { return "<div class='diff'>" + rows.map(function (r) { return "<div class='" + r[1] + "'>" + esc(r[0]) + "</div>"; }).join("") + "</div>"; }
    return [render(left), render(right)];
  }
  function compare(g, otherId) {
    var a = byId[g.keepId], b = byId[otherId];
    var pair = g.pairs.filter(function (p) { return (p.a === a.id && p.b === b.id) || (p.b === a.id && p.a === b.id); })[0];
    var d = diff(a.source, b.source);
    return "<div class='small muted' style='margin:8px 0 4px'>" + (pair ? esc(pair.level.replace("_", " ").toLowerCase()) + " · similarity " + Math.round(pair.similarity * 100) + "%" : "linked through other members of the group")
      + " · lines only on one side are highlighted</div><div class='cmp'><div class='side'><div class='small'><span class='keep'>Keep</span> " + esc(a.className + "." + a.name) + "</div>" + d[0]
      + "</div><div class='side'><div class='small'>Replace " + esc(b.className + "." + b.name) + "</div>" + d[1] + "</div></div>";
  }
  function renderDuplicates() {
    var q = $("d-q").value.trim().toLowerCase(), level = $("d-level").value;
    var groups = D.duplicateGroups.filter(function (g) {
      if (level && g.levelLabel !== level) return false;
      if (!q) return true;
      return g.memberIds.some(function (id) { var m = byId[id]; return (m.className + "." + m.name + " " + author(m) + " " + m.file).toLowerCase().indexOf(q) >= 0; });
    });
    if (!groups.length) { $("d-list").innerHTML = "<div class='empty'>" + (D.duplicateGroups.length ? "No group matches the filters." : "No duplicate methods found.") + "</div>"; return; }
    $("d-list").innerHTML = groups.map(function (g) {
      var keep = byId[g.keepId];
      var others = g.memberIds.filter(function (id) { return id !== g.keepId; });
      return "<div class='card' id='group-" + g.number + "'><h2 style='margin:0 0 4px'>#" + g.number + " <span class='chip lvl'>" + esc(g.levelLabel) + "</span> "
        + esc(keep.name) + " <span class='muted small'>" + g.memberIds.length + " methods · about " + g.removableLines + " lines removable</span></h2>"
        + "<div class='small muted'>" + esc(g.levelMeaning) + "</div>"
        + "<p style='margin:8px 0'><span class='keep'>Keep " + esc(keep.className + "." + keep.name) + "</span> (" + esc(g.keepReason) + "). Replace the calls of the others with it"
        + (g.level === "SAME_JOB" || g.level === "RENAMED" ? ", adding parameters for the values that differ." : ".") + "</p>"
        + "<div class='table-wrap'><table><thead><tr><th></th><th>Method</th><th>What it does</th><th class='num'>Calls</th><th class='num'>Lines</th><th class='hide-sm'>Author</th><th class='hide-sm'>Location</th></tr></thead><tbody>"
        + g.memberIds.map(function (id) { var m = byId[id];
          return "<tr><td>" + (id === g.keepId ? "<span class='keep'>keep</span>" : "<span class='muted'>replace</span>") + "</td><td><span class='mname'>" + esc(m.className + "." + m.name) + "</span></td><td class='small'>" + esc(m.description)
            + "</td><td class='num'>" + (m.stepText != null ? Math.max(0, m.stepUsageCount) : m.callCount) + "</td><td class='num'>" + (m.endLine - m.beginLine + 1) + "</td><td class='hide-sm small'>" + esc(author(m)) + "</td><td class='hide-sm small'>" + loc(m.file, m.beginLine) + "</td></tr>"; }).join("")
        + "</tbody></table></div>"
        + "<div class='filters' style='margin:10px 0 0'><label class='small muted'>Compare with</label><select data-cmp='" + g.number + "'>"
        + others.map(function (id) { return "<option value='" + esc(id) + "'>" + esc(byId[id].className + "." + byId[id].name) + "</option>"; }).join("") + "</select></div>"
        + "<div data-cmpview='" + g.number + "'>" + compare(g, others[0]) + "</div></div>";
    }).join("");
  }
  $("d-q").addEventListener("input", debounce(renderDuplicates));
  $("d-level").addEventListener("change", renderDuplicates);
  $("d-list").addEventListener("change", function (ev) {
    var s = ev.target.closest("[data-cmp]"); if (!s) return;
    var g = D.duplicateGroups.filter(function (x) { return String(x.number) === s.dataset.cmp; })[0];
    document.querySelector("[data-cmpview='" + g.number + "']").innerHTML = compare(g, s.value);
  });
  renderDuplicates();

  // ---------- recommendations ----------
  options($("r-sev"), SEV.filter(function (s) { return D.findings.some(function (f) { return f.severity === s; }); }).map(function (s) { return [s]; }));
  options($("r-cat"), Object.keys(count(D.findings, function (f) { return rules[f.ruleId].category; })).sort().map(function (k) { return [k]; }));
  options($("r-rule"), sortedEntries(count(D.findings, function (f) { return f.ruleId; })).map(function (e) { return [e[0], rules[e[0]].title + " (" + e[1] + ")"]; }));
  options($("r-author"), Object.keys(count(D.findings, function (f) { return f.author; })).sort().map(function (k) { return [k]; }));
  var PAGE = 25;
  function renderRecs() {
    var q = $("r-q").value.trim().toLowerCase(), sev = $("r-sev").value, cat = $("r-cat").value, rule = $("r-rule").value, au = $("r-author").value;
    var list = D.findings.filter(function (f) {
      var r = rules[f.ruleId];
      if (sev && f.severity !== sev) return false;
      if (cat && r.category !== cat) return false;
      if (rule && f.ruleId !== rule) return false;
      if (au && f.author !== au) return false;
      if (q && (f.message + " " + f.className + " " + f.methodName + " " + f.file + " " + r.title).toLowerCase().indexOf(q) < 0) return false;
      return true;
    });
    var byRule = {}; list.forEach(function (f) { (byRule[f.ruleId] = byRule[f.ruleId] || []).push(f); });
    var ids = Object.keys(byRule).sort(function (a, b) { return SEV.indexOf(rules[a].severity) - SEV.indexOf(rules[b].severity) || byRule[b].length - byRule[a].length; });
    $("r-summary").innerHTML = ids.length ? "<div class='card'><div class='table-wrap'><table><thead><tr><th>Rule</th><th class='hide-sm'>Category</th><th>Severity</th><th class='num'>Findings</th></tr></thead><tbody>"
      + ids.map(function (id) { var r = rules[id]; return "<tr class='clickable' data-rule='" + id + "'><td>" + esc(r.title) + "</td><td class='hide-sm'>" + esc(r.category) + "</td><td><span class='chip sev-" + r.severity + "'>" + r.severity + "</span></td><td class='num'>" + byRule[id].length + "</td></tr>"; }).join("")
      + "</tbody></table></div></div>" : "";
    $("r-list").innerHTML = ids.length ? ids.map(function (id) {
      var r = rules[id], fs = byRule[id];
      return "<div class='card rule' id='rule-" + id + "'><h3><span class='chip sev-" + r.severity + "'>" + r.severity + "</span>" + esc(r.title) + " <span class='muted small'>" + esc(r.category) + " · " + id + " · " + fs.length + " finding(s)</span></h3>"
        + "<p style='margin:4px 0 8px'>" + esc(r.why) + "</p>"
        + "<div class='ba'><div><div class='t'>Instead of</div><pre>" + esc(r.before) + "</pre></div><div><div class='t'>Write</div><pre>" + esc(r.after) + "</pre></div></div>"
        + "<div class='table-wrap'><table><thead><tr><th>Where</th><th>Finding</th><th class='hide-sm'>Author</th></tr></thead><tbody data-rows='" + id + "'>" + rows(fs, PAGE) + "</tbody></table></div>"
        + (fs.length > PAGE ? "<button class='more' type='button' data-more='" + id + "'>Show all " + fs.length + "</button>" : "") + "</div>";
    }).join("") : "<div class='empty'>" + (D.findings.length ? "No finding matches the filters." : "No recommendations: the code follows every rule.") + "</div>";
    $("r-list").dataset.ids = JSON.stringify(ids);
    renderRecs.byRule = byRule;
  }
  function rows(fs, limit) {
    return fs.slice(0, limit).map(function (f) {
      return "<tr><td class='small'><span class='mname'>" + esc((f.className || "") + (f.methodName ? "." + f.methodName : "")) + "</span><div class='muted'>" + loc(f.file, f.line) + "</div></td><td>" + esc(f.message) + "</td><td class='hide-sm small'>" + esc(f.author || "") + "</td></tr>"; }).join("");
  }
  ["r-q"].forEach(function (id) { $(id).addEventListener("input", debounce(renderRecs)); });
  ["r-sev", "r-cat", "r-rule", "r-author"].forEach(function (id) { $(id).addEventListener("change", renderRecs); });
  $("r-list").addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-more]"); if (!b) return;
    document.querySelector("[data-rows='" + b.dataset.more + "']").innerHTML = rows(renderRecs.byRule[b.dataset.more], 100000);
    b.remove();
  });
  $("r-summary").addEventListener("click", function (ev) {
    var tr = ev.target.closest("[data-rule]"); if (!tr) return;
    var t = $("rule-" + tr.dataset.rule); if (t) t.scrollIntoView({behavior: "smooth"});
  });
  renderRecs();
})();
</script>
</body>
</html>
